name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.1) — creates tag v<version>'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Name the APK and AAB
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Fogwalk.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Fogwalk-v${{ steps.v.outputs.name }}.aab"
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set — the APK is signed with the CI debug key."
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.v.outputs.name }}" 'index($0, "## [" v "]") == 1 {f=1; next} index($0, "## [") == 1 {f=0} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Fogwalk ${{ steps.v.outputs.name }}" > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Fogwalk v${{ steps.v.outputs.name }}
          body_path: dist/notes.md
          files: |
            dist/*.apk
            dist/*.aab
